# This is a basic workflow to help you get started with Actions

name: Build Zip Installer

# Controls when the action will run. Triggers the workflow on push or pull request
# events but only for the main branch
on:
  push:
    branches: [main, UniXNU]
  pull_request:
    branches: [main]
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build:
    name: Zip installer Build
    # The type of runner that the job will run on
    runs-on: ubuntu-24.04

    strategy:
      max-parallel: 8
      matrix:
        device:
          - dw99
          - t610yp
          - s16b


    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Install requires packages
        run: |
          sudo apt-get update
          sudo apt install -y build-essential uuid-dev iasl git nasm python-is-python3 gettext gcc-aarch64-linux-gnu clang llvm device-tree-compiler

      - name: Build device ${{ matrix.device }}
        run: |
          ./build.sh --device ${{ matrix.device }} --installer-zip

      - name: Upload a Build Artifact
        uses: actions/upload-artifact@v7.0.1
        with: # Artifact name
          name: ${{ matrix.device }}
          # A file, directory or wildcard pattern that describes what to upload
          path: ./*.zip
          archive: false
